version: v2025.07.0
tutorial: false


run:
  name: "egon2019" # use this to keep track of runs with different settings
  disable_progressbar: false
  shared_resources:
    policy: false
  shared_cutouts: true

foresight: overnight #overnight, myopic

scenario:
  clusters:
  - 36
  opts:
  - 'lv1.0-CCL' #-Ept
  sector_opts:
  - ''
  planning_horizons:
  - '2030'
  # - '2040'

# Germany plus 9 "Stromnachbarn" # 2024: 11 Stromnachbarn -> 2030: 12 Stromnachbarn (zusätzlich GB)
countries: ['AT', 'BE', 'CH', 'CZ', 'DE', 'DK', 'FR', 'GB', 'LU', 'NL', 'NO', 'PL', 'SE'] 

snapshots:
  start: "2012-01-01" #1996, 2010, 2012, 2013, 2019, 2020 and 2023
  end: "2013-01-01"
  inclusive: 'left'
  
enable:
  drop_leap_day: true

electricity:
  voltages: [110., 220., 300., 380., 750.]
  base_network: egon #osm-prebuilt
  osm-prebuilt-version: status2019_PoWerD_v3 #0.6
  co2limit_enable: false
  co2limit: 100.e+6

  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, CCGT, biomass]
    StorageUnit: [battery, H2]
    Store: []
    Link: []

  powerplants_filter: DateIn <= 2030 and (DateOut >= 2030 or DateOut != DateOut) and not (Country == 'Germany' and Fueltype == 'Nuclear') #Country in ['DE', 'LU'] and 
  custom_powerplants: false
  everywhere_powerplants: [] #[solar, onwind, offwind-ac, offwind-dc, CCGT]

  conventional_carriers: [oil, OCGT, CCGT, coal, lignite, nuclear, geothermal, biomass] # 
  renewable_carriers: [solar, onwind, offwind-ac, offwind-dc, hydro]

  estimate_renewable_capacities:
    enable: true
    from_gem: false #true
    year: 2023 # neueste Daten von 2023, Stand 30.09.2025
    expansion_limit: 2.7 # 2.563 NEP 2023 #false
    technology_mapping:
      Offshore: offwind-ac
      Onshore: onwind
      PV: solar

  transmission_limit: v1.0 # kein endogener Netzausbau

atlite:
  default_cutout: europe-2012-sarah3-era5 #1996, 2010, 2012, 2013, 2019, 2020 and 2023
  cutouts: europe-2012-sarah3-era5

renewable:
  offwind-ac:
    max_depth: false
    correction_factor: 0.2873 #0.6127
  offwind-dc:
    max_depth: false
    correction_factor: 0.2873 #0.6127
  offwind-float:
    max_depth: false
    min_depth: false
    correction_factor: 0.2873 #0.6127
  onwind:
    correction_factor: 0.4690 #0.9069
  solar:
    correction_factor: 0.4087 #0.8112

conventional:
  dynamic_fuel_price: false #true

lines:
  s_max_pu: 0.7
  max_extension: 0 #MW
  length_factor: 1.12 #1.35 #ermittelt aus osm-raw(length) und Haversine-Distanz: Die kürzeste Entfernung zwischen zwei Punkten auf einer Kugeloberfläche (z. B. der Erde). Sie wird unter Verwendung der Längen- und Breitengrade sowie der Radius der Kugel berechnet
  dynamic_line_rating:
    activate: false #true
    max_line_rating: 1.3

links:
  p_max_pu: 1.0
  max_extension: 0 #MW

transmission_projects:
  enable: true
  include:
    tyndp2020: false #true
    nep: false #true
    manual: true
  skip:
  -
  # - upgraded_lines
  # - upgraded_links
  status:
  - completed
  - under_construction
  - in_permitting
  - confirmed
    #- planned_not_yet_permitted
    #- under_consideration
  new_link_capacity: keep #keep or zero

load:
  scaling_factor: 1.525 # ermittelt aus Status 2012 (Wetterjahr) und NEP 2023

existing_capacities:
  grouping_years_power: [1920, 1950, 1955, 1960, 1965, 1970, 1975, 1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2020, 2025, 2030]
  grouping_years_heat: [1980, 1985, 1990, 1995, 2000, 2005, 2010, 2015, 2019] # heat grouping years >= baseyear will be ignored
  threshold_capacity: 10
  default_heating_lifetime: 20
  conventional_carriers:
  - lignite
  - coal
  - oil
  - uranium
  
costs:
  year: 2025 # nur Daten für  [2020, 2025, 2030, 2035, 2040, 2045, 2050] möglich https://github.com/PyPSA/technology-data/tree/master/outputs
  version: v0.13.3 # (latest Version of technology-data) https://github.com/PyPSA/technology-data

clustering:
  focus_weights:
    #303 nodes: 290 for Germany, 1 per each of other 12 "Stromnachbarn" 
    'DE': 0.611111 # 290/303
    'AT': 0.027777 # 1/303
    'BE': 0.027777
    'CH': 0.027777
    'CZ': 0.027777
    'DK': 0.055555
    'FR': 0.027777
    'GB': 0.055555
    'LU': 0.027777
    'NL': 0.027777
    'NO': 0.027777
    'PL': 0.027777
    'SE': 0.027777
  build_bidding_zones:
    remove_islands: true
    aggregate_to_tyndp: true
  simplify_network:
    to_substations: true #false
    remove_stubs: false #true
    remove_stubs_across_borders: false
    hv_reduction: true
  cluster_network:
    algorithm: modularity #[kmeans, hac, modularity]
  exclude_carriers: false #[nuclear,lignite,OCGT,CCGT,coal,oil]

solving:
  options:
    load_shedding: false #true
    noisy_costs: false #true
  agg_p_nom_limits:
    agg_offwind: true #false
    agg_solar: true #false
    include_existing: true #false
    file: data/agg_p_nom_minmax.csv
  constraints:
    CCL: true #false
  solver:
    name: gurobi
    options: "gurobi-numeric-focus" #gurobi-default #gurobi-runtime
    # name: highs
    # options: highs-simplex
  solver_options:
    gurobi-runtime:
      threads: 19
      NodefileStart: 0.95
      NumericFocus: 1
      Presolve: -1
      PreSparsify: 1
    gurobi-numeric-focus:
      threads: 20 #3


  check_objective:
    enable: false
    expected_value: 3.8120188094e+07
